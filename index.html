<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtárkezelő rendszer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-gray-50 text-gray-800">
    <h1 class="flex items-center justify-center h-24 bg-emerald-900 px-4 text-center text-2xl font-semibold tracking-wide text-white shadow-sm sm:h-28 sm:text-3xl">
        Könyvtárkezelő rendszer
    </h1>
    <p id="konyvHibaUzenet" class="flex items-center justify-center my-4 text-red-600 font-medium"></p>
    
    <form id="konyvForm" class="mx-auto mb-8 max-w-3xl rounded-xl border border-gray-200 bg-white px-5 py-6 shadow-sm sm:px-8" onsubmit="konyvMent(event)">
        <div class="relative z-0 w-full mb-6 group">
            <input type="text" id="cim" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:border-blue-600 peer" placeholder=" " required />
            <label for="cim" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Cím</label>
        </div>
        <div class="relative z-0 w-full mb-6 group">
            <input type="text" id="szerzo" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:border-blue-600 peer" placeholder=" " required />
            <label for="szerzo" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Szerző</label>
        </div>
        <div class="relative z-0 w-full mb-6 group">
            <input type="number" id="kiadasiev" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:border-blue-600 peer" placeholder=" " required />
            <label for="kiadasiev" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Kiadási év</label>
        </div>
        <div class="relative z-0 w-full mb-6 group">
            <input type="number" id="oldalszam" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 focus:outline-none focus:border-blue-600 peer" placeholder=" " required />
            <label for="oldalszam" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">Oldalszám</label>
        </div>
        <div class="mb-6">
            <label for="kategoria" class="mb-2 block text-sm font-medium text-gray-700">Kategória</label>
            <select id="kategoria" required class="block w-full rounded-lg border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-emerald-700 focus:outline-none">
                <option value="Regény">Regény</option>
                <option value="Sci-fi">Sci-fi</option> <option value="Történelmi">Történelmi</option> <option value="Fantasy">Fantasy</option>
            </select>
        </div>
        <button type="submit" class="w-full rounded-lg bg-emerald-800 px-5 py-2.5 text-sm font-medium text-white hover:bg-emerald-900 sm:w-auto">Könyv hozzáadása</button>
    </form>

    <div class="mx-auto max-w-6xl overflow-x-auto rounded-xl border border-gray-200 bg-white shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 px-5 py-4">
            <label for="kategoriaSzuro" class="text-sm font-medium text-gray-700">Szűrés kategória szerint</label>
            <select id="kategoriaSzuro" onchange="kategoriaSzerintiSzures(this.value)" class="min-w-48 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-emerald-700 focus:outline-none">
                <option value="Mind">Mindegyik kategória</option> <option value="Regény">Regény</option> <option value="Sci-fi">Sci-fi</option> <option value="Történelmi">Történelmi</option> <option value="Fantasy">Fantasy</option>
            </select>
        </div>
        <table class="w-full min-w-[760px] text-left text-sm text-gray-600">
            <thead class="border-b border-emerald-100 bg-emerald-50 text-xs uppercase tracking-wide text-emerald-950">
                <tr>
                    <th class="px-5 py-4 font-semibold">Cím</th> <th class="px-5 py-4 font-semibold">Szerző</th> <th class="px-5 py-4 font-semibold">Kiadási év</th> <th class="px-5 py-4 font-semibold">Oldalak</th> <th class="px-5 py-4 font-semibold">Kategória</th> <th class="px-5 py-4 font-semibold">Állapot</th> <th class="px-5 py-4 font-semibold">Műveletek</th>
                </tr>
            </thead>
            <tbody id="konyvTablazatMegjelenites"></tbody>
        </table>
    </div>

    <div class="mx-auto mt-5 flex max-w-6xl flex-wrap gap-3 rounded-xl border border-gray-200 bg-white p-5 shadow-sm sm:p-6">
        <button onclick="osszesKonyv()" class="rounded-lg bg-emerald-800 px-4 py-2.5 text-sm font-medium text-white hover:bg-emerald-900">Összes könyv</button>
        <button onclick="szabadKonyvek()" class="rounded-lg bg-emerald-800 px-4 py-2.5 text-sm font-medium text-white hover:bg-emerald-900">Szabad könyvek</button>
        <button onclick="legregebbiKonyv()" class="rounded-lg bg-white px-4 py-2.5 text-sm font-medium text-emerald-900 ring-1 ring-emerald-200 hover:bg-emerald-50">Legrégebbi könyvek</button>
        <button onclick="legvastagabbKonyv()" class="rounded-lg bg-white px-4 py-2.5 text-sm font-medium text-emerald-900 ring-1 ring-emerald-200 hover:bg-emerald-50">Legvastagabb könyv</button>
        <button onclick="atlagosOldalszam()" class="rounded-lg bg-white px-4 py-2.5 text-sm font-medium text-emerald-900 ring-1 ring-emerald-200 hover:bg-emerald-50">Átlagos oldalszám</button>
        <p id="konyvEredmeny" class="basis-full text-sm font-medium text-emerald-900" aria-live="polite"></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
