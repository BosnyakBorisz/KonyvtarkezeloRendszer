<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtárkezelő rendszer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white text-gray-900">
    <h1 class="flex items-center justify-center h-30 bg-gray-100 text-2xl font-semibold">
        Könyvtárkezelő rendszer
    </h1>

    <p id="konyvHibaUzenet" class="flex items-center justify-center my-4 text-red-600 font-medium"></p>

    <form id="konyvForm" class="max-w-md mx-auto mb-8 px-4" onsubmit="konyvMent(event)">
        
        <div class="relative z-0 w-full mb-6 group">
            <input type="text" id="cim" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required />
            <label for="cim" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                Cím
            </label>
        </div>

        <div class="relative z-0 w-full mb-6 group">
            <input type="text" id="szerzo" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required />
            <label for="szerzo" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                Szerző
            </label>
        </div>

        <div class="relative z-0 w-full mb-6 group">
            <input type="number" id="kiadasiev" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required />
            <label for="kiadasiev" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                Kiadási év
            </label>
        </div>

        <div class="relative z-0 w-full mb-6 group">
            <input type="number" id="oldalszam" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer" placeholder=" " required />
            <label for="oldalszam" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-blue-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto">
                Oldalszám
            </label>
        </div>

   
        <!-- <div class="relative z-0 w-full mb-6 group">
            <select id="kategoria" class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer">
                <option value="Fantasy">Fantasy</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Krimi">Krimi</option>
                <option value="Szépirodalom">Szépirodalom</option>
                <option value="Thriller">Thriller</option>
                <option value="Klasszikus">Klasszikus</option>
            </select>
        </div> -->


        <button type="submit" id="mentoGomb" class="w-full sm:w-auto text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 shadow-sm font-medium leading-5 rounded-lg text-sm px-5 py-2.5 focus:outline-none transition-colors">
            Mentés
        </button>
    </form>

    <div class="max-w-3xl mx-auto relative overflow-x-auto bg-neutral-100 shadow-sm rounded-lg border border-gray-200">
        <!-- <div class="p-4 flex items-center justify-between space-x-4">
            <label for="input-group-1" class="sr-only">Keresés</label>
            <div class="relative">
                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                    <svg class="w-4 h-4 text-gray-500" aria-hidden="true" xmlns="http://w3.org" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
                </div>
                <input type="text" id="keresoInput" class="block w-full max-w-sm ps-9 pe-3 py-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm placeholder:text-gray-400" placeholder="Search">
            </div>
        </div> -->
        <table class="w-full text-sm text-left rtl:text-right text-gray-500">
            <thead class="text-sm text-gray-700 bg-gray-50 border-b border-t border-gray-200">
                <tr>
                    <th scope="col" class="px-6 py-3 font-medium">Cím</th>
                    <th scope="col" class="px-6 py-3 font-medium">Szerző</th>
                    <th scope="col" class="px-6 py-3 font-medium">Kiadási év</th>
                    <th scope="col" class="px-6 py-3 font-medium">Oldalak</th>
                    <th scope="col" class="px-6 py-3 font-medium">Kategória</th>
                    <th scope="col" class="p-4">Állapot</th>
                    <th scope="col" class="p-4">Módosítás</th>
                </tr>
            </thead>
            <tbody id="konyvTablazatMegjelenites">
                
            </tbody>
        </table>
    </div>

    <div class="max-w-3xl mx-auto mt-6 p-6 bg-white shadow-sm rounded-lg border border-gray-200">
        <button 
            onclick="osszesKonyv()" 
            id="osszesKonyv"
            class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 shadow-sm font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none">
            Összes könyv
        </button>
        <button 
            onclick="szabadKonyvek()" 
            id="szabadKonyvek"
            class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 shadow-sm font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none">
            Szabad könyvek
        </button>
        <button 
            onclick="legregebbiKonyv()" 
            id="legregebbiKonyv"
            class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 shadow-sm font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none">
            Legrégebbi könyvek 
        </button>
        <button 
            onclick="legvastagabbKonyv()" 
            id="legvastagabbKonyv"
            class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 shadow-sm font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none">
            Legvastagabb könyv
        </button>
        <button 
            onclick="atlagosOldalszam()" 
            id="atlagosOldalszam"
            class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 shadow-sm font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none">
            Átlagos oldalszám
        </button>

    </div>

    <script src="app.js"></script>
</body>
</html>
